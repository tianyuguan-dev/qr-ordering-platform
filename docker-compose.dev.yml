# Development environment - Start database and cache only
# Usage: docker-compose -f docker-compose.dev.yml up -d

version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: qr-ordering-db-dev
    environment:
      POSTGRES_DB: qr_ordering
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"  # Map to local port 5433 to avoid conflict
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d qr_ordering"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: qr-ordering-redis-dev
    ports:
      - "6379:6379"
    restart: unless-stopped

  # MinIO object storage (S3-compatible, for images: logo, dish photos)
  minio:
    image: minio/minio:latest
    container_name: qr-ordering-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console (optional)
    volumes:
      - ./minio-data:/data
    restart: unless-stopped

volumes:
  postgres_dev_data:
    driver: local

networks:
  default:
    name: qr-ordering-dev-network
