# Prometheus config - scrape Spring Boot Actuator /actuator/prometheus
# Backend is expected at host:8080 (context-path /api)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'qr-ordering'
    metrics_path: '/api/actuator/prometheus'
    static_configs:
      # host.docker.internal = host machine from inside Docker (Mac/Windows; Linux may need extra_hosts)
      - targets: ['host.docker.internal:8080']
        labels:
          app: 'qr-ordering'
