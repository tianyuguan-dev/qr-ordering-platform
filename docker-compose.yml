# Full-stack one-command startup — no other files needed
# Usage: docker-compose up -d
#
# Services:
#   Frontend:   http://localhost        (Vue SPA via Nginx)
#   Backend:    http://localhost/api    (proxied by Nginx)
#   Grafana:    http://localhost:3001   (admin / admin)
#   Prometheus: http://localhost:9090
#   MinIO:      http://localhost:9001   (console, minioadmin / minioadmin)

services:
  postgres:
    image: postgres:15-alpine
    container_name: qr-ordering-db
    environment:
      POSTGRES_DB: qr_ordering
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d qr_ordering"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: qr-ordering-redis
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: qr-ordering-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  backend:
    image: tianyuguan/qr-ordering:backend
    container_name: qr-ordering-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/qr_ordering
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: http://localhost:9000
      APP_CUSTOMER_BASE_URL: http://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: tianyuguan/qr-ordering:frontend
    container_name: qr-ordering-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: qr-ordering-prometheus
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: qr-ordering-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/datasource.yml
      - source: grafana_dashboard_provider
        target: /etc/grafana/provisioning/dashboards/dashboard.yml
      - source: grafana_dashboard_json
        target: /etc/grafana/provisioning/dashboards/qr-ordering-dashboard.json
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  grafana_data:

networks:
  default:
    name: qr-ordering-network

configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
      scrape_configs:
        - job_name: 'qr-ordering'
          metrics_path: '/api/actuator/prometheus'
          static_configs:
            - targets: ['backend:8080']
              labels:
                app: 'qr-ordering'

  grafana_datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          editable: false

  grafana_dashboard_provider:
    content: |
      apiVersion: 1
      providers:
        - name: 'QR Ordering'
          orgId: 1
          folder: ''
          folderUid: 'qr-ordering'
          type: file
          disableDeletion: false
          updateIntervalSeconds: 30
          allowUiUpdates: true
          options:
            path: /etc/grafana/provisioning/dashboards

  grafana_dashboard_json:
    content: |
      {
        "annotations": { "list": [] },
        "editable": true,
        "fiscalYearStartMonth": 0,
        "graphTooltip": 0,
        "id": null,
        "links": [],
        "liveNow": false,
        "panels": [
          {
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "short" }, "overrides": [] },
            "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
            "id": 1,
            "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true } },
            "targets": [{ "expr": "rate(orders_created_total[5m]) * 60", "legendFormat": "orders/min", "refId": "A" }],
            "title": "Orders created (per min)",
            "type": "timeseries"
          },
          {
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "short" }, "overrides": [] },
            "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
            "id": 2,
            "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true } },
            "targets": [{ "expr": "rate(orders_status_changed_total[5m]) * 60", "legendFormat": "status changes/min", "refId": "A" }],
            "title": "Order status changes (per min)",
            "type": "timeseries"
          },
          {
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "mappings": [], "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 1000 }, { "color": "red", "value": 10000 }] }, "unit": "short" }, "overrides": [] },
            "gridPos": { "h": 6, "w": 4, "x": 12, "y": 0 },
            "id": 3,
            "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
            "targets": [{ "expr": "outbox_backlog", "refId": "A" }],
            "title": "Outbox backlog",
            "type": "stat"
          },
          {
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "mappings": [], "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] }, "unit": "short" }, "overrides": [] },
            "gridPos": { "h": 6, "w": 4, "x": 16, "y": 0 },
            "id": 4,
            "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
            "targets": [{ "expr": "outbox_dead", "refId": "A" }],
            "title": "Outbox dead letters",
            "type": "stat"
          },
          {
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "short" }, "overrides": [] },
            "gridPos": { "h": 6, "w": 4, "x": 20, "y": 0 },
            "id": 5,
            "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
            "targets": [{ "expr": "sse_connections", "refId": "A" }],
            "title": "SSE connections",
            "type": "stat"
          },
          {
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "short" }, "overrides": [] },
            "gridPos": { "h": 6, "w": 12, "x": 0, "y": 6 },
            "id": 6,
            "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true } },
            "targets": [{ "expr": "outbox_backlog", "legendFormat": "backlog", "refId": "A" }],
            "title": "Outbox backlog (over time)",
            "type": "timeseries"
          },
          {
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "short" }, "overrides": [] },
            "gridPos": { "h": 6, "w": 12, "x": 12, "y": 6 },
            "id": 7,
            "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true } },
            "targets": [{ "expr": "sse_connections", "legendFormat": "connections", "refId": "A" }],
            "title": "SSE connections (over time)",
            "type": "timeseries"
          },
          {
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "short" }, "overrides": [] },
            "gridPos": { "h": 6, "w": 12, "x": 0, "y": 12 },
            "id": 8,
            "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true } },
            "targets": [{ "expr": "rate(outbox_publish_failed_total[5m])", "legendFormat": "failures/sec", "refId": "A" }],
            "title": "Outbox publish failures (rate)",
            "type": "timeseries"
          }
        ],
        "refresh": "10s",
        "schemaVersion": 38,
        "style": "dark",
        "tags": ["qr-ordering"],
        "templating": { "list": [] },
        "time": { "from": "now-1h", "to": "now" },
        "timepicker": {},
        "timezone": "browser",
        "title": "QR Ordering Platform",
        "uid": "qr-ordering",
        "version": 1,
        "weekStart": ""
      }
