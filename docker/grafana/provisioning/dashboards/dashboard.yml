# Load dashboards from JSON files in this folder
apiVersion: 1
providers:
  - name: 'QR Ordering'
    orgId: 1
    folder: ''
    folderUid: 'qr-ordering'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
