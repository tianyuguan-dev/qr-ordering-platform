# Monitoring stack: Prometheus + Grafana
# Prerequisite: backend running on host:8080 (e.g. mvn spring-boot:run)
# Usage: docker-compose -f docker-compose.monitoring.yml up -d
# Then: Grafana http://localhost:3001 (admin / admin), Prometheus http://localhost:9090

version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: qr-ordering-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: qr-ordering-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana_data:
    driver: local
