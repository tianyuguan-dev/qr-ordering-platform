# Full-stack one-command startup (backend + frontend + all infrastructure)
# Usage: docker-compose up -d
#
# Services:
#   Frontend:   http://localhost        (Vue SPA via Nginx)
#   Backend:    http://localhost/api    (proxied by Nginx)
#   Grafana:    http://localhost:3001   (admin / admin)
#   Prometheus: http://localhost:9090
#   MinIO:      http://localhost:9001   (console, minioadmin / minioadmin)

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: qr-ordering-db
    environment:
      POSTGRES_DB: qr_ordering
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d qr_ordering"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: qr-ordering-redis
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: qr-ordering-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API (image access)
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    restart: unless-stopped

  backend:
    image: tianyuguan/qr-ordering:backend
    container_name: qr-ordering-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/qr_ordering
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: http://localhost:9000
      APP_CUSTOMER_BASE_URL: http://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: tianyuguan/qr-ordering:frontend
    container_name: qr-ordering-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: qr-ordering-prometheus
    volumes:
      - ./docker/prometheus/prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: qr-ordering-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  grafana_data:

networks:
  default:
    name: qr-ordering-network
