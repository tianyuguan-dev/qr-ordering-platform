# Development environment - app dependencies + monitoring (DB, cache, MinIO, Prometheus, Grafana)
# Usage: docker-compose -f docker-compose.dev.yml up -d
# Then:
# - Backend: run locally on :8080 (e.g. mvn spring-boot:run)
# - Prometheus: http://localhost:9090
# - Grafana: http://localhost:3001 (admin / admin)

version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: qr-ordering-db-dev
    environment:
      POSTGRES_DB: qr_ordering
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"  # Map to local port 5433 to avoid conflict
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d qr_ordering"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: qr-ordering-redis-dev
    ports:
      - "6379:6379"
    restart: unless-stopped

  # MinIO object storage (S3-compatible, for images: logo, dish photos)
  minio:
    image: minio/minio:latest
    container_name: qr-ordering-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console (optional)
    volumes:
      - ./minio-data:/data
    restart: unless-stopped

  # Prometheus (scrapes Spring Boot Actuator /api/actuator/prometheus on host:8080)
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: qr-ordering-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Grafana (dashboards for QR Ordering metrics)
  grafana:
    image: grafana/grafana:10.2.0
    container_name: qr-ordering-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_dev_data:
    driver: local
  grafana_data:
    driver: local

networks:
  default:
    name: qr-ordering-dev-network
